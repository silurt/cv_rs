[workspace]
members = [
  "packages/core",
  "packages/render",
  "packages/docx",
  "packages/cli"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
oxidize-pdf = "4.7"
serde_json = "1.0.149"
zip = { version = "8", default-features = false, features = ["deflate"] }
